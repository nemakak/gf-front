<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0C0A08" />
    <title>Style Room</title>

    <!-- Google Fonts: Onest (для карточек) + Unbounded (для кнопок) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg:         '#0C0A08',
              bgSoft:     '#141010',
              card:       '#1A1412',
              cardHover:  '#221A17',
              border1:    '#231C18',
              border2:    '#332822',
              borderGlow: '#4A3A30',
              accent:     '#D4B595',
              accentSoft: '#B89876',
              title:      '#F2EAE0',
              muted:      '#8A7F76',
              muted2:     '#A39788'
            },
            fontFamily: {
              sans:    ['Inter', 'system-ui', 'sans-serif'],
              product: ['Onest', 'system-ui', 'sans-serif'],
              btn:     ['Unbounded', 'Inter', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
